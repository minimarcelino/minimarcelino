name: Generate Snake

permissions:
  contents: write   # 👉 dá permissão para a Action criar/atualizar branch

on:
  schedule: # gera todo dia às 23h59 UTC
    - cron: "59 23 * * *"
  workflow_dispatch: # permite rodar manualmente pelo Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: minimarcelino
          outputs: dist/github-contribution-grid-snake.svg

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
